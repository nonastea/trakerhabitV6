<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variaciones Milo</title>
<style>
body{margin:0;background:#0b0f14;color:#e8eef3;font-family:-apple-system,Segoe UI,sans-serif;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}p.s{opacity:.6;margin:0 0 24px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.c{background:#131a22;border-radius:18px;padding:16px}
.c svg.big{width:100%;height:auto;border-radius:22%;display:block}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.row svg{width:60px;height:60px;border-radius:22%}.row svg.sm{width:30px;height:30px}
h3{margin:12px 0 4px;font-size:15px}.c p{margin:0;font-size:13px;opacity:.75;line-height:1.4}
</style></head><body>
<h1>12 versiones de Milo coronado</h1><p class="s">Grande · iPhone (60 px) · notificación (30 px)</p>
<div class="g" id="g"></div>
<script>
const R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const COL={h:'#3a2410',o:'#c8721e',O:'#e08a2a',L:'#f2a54a',b:'#8a4a14',e:'#1b1b1b',f:'#3a2410',c:'#00d4ff',w:'#ffffff',y:'#ffd166',r:'#ff3b5c',p:'#ff8fb1'};
function grid(map,x,y,u,over={}){let s='';map.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='.')return;s+=R(x+i*u,y+j*u,u,u,over[ch]||COL[ch])}));return s}
// Milo base 14x16
const M=[
"......h.......",
"......h.......",
"....oooooo....",
"...oLLOOOOo...",
"..oLOOOOOOOo..",
"..oOOOOOOOOo..",
".oOeOOOOOeOOo.",
".oOeOOOOOOOOo.",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
".oOOOOOOOOOOo.",
"..oOOOOOOOOo..",
"...oooooooo...",
"...ff....ff...",
"...ff....ff..."];
const CHK=[[4,11],[5,12],[6,11],[7,10],[8,9]];
const chk=(x,y,u,c='#00d4ff')=>CHK.map(([i,j])=>R(x+i*u,y+j*u,u,u,c)).join('');
const milo=(x,y,u,opt={})=>{let m=opt.map||M;let s=grid(m,x,y,u);if(opt.check!==false)s+=chk(x,y,u,opt.cc);return s};
const JUMP=M.slice(0,16).concat(["..ff......ff..",".ff........ff."]);
const bubbleChk=(x,y,u,c)=>[[0,2],[1,3],[2,2],[3,1],[4,0]].map(([i,j])=>R(x+i*u,y+j*u,u,u,c)).join('');
const SVG=s=>`<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${s}</svg>`;
const stars=(c,pts)=>pts.map(([x,y,u])=>R(x,y,u,u,c)).join('');
const NOFACE=M.map((r,j)=>(j<2?r.replace('h','.'):r).replace(/e/g,'O'));
const X=88,Y=64,U=24;
const px=(cells,c)=>cells.map(([i,j])=>R(X+i*U,Y+j*U,U,U,c)).join('');
const K='#1b1b1b',W='#ffffff',P='#ff8fb1',Yl='#ffd166';
const crown=grid(["y..y..y","yyyyyyy","yyyyyyy"],172,40,24);
const base=(face,bg='#001828')=>R(0,0,512,512,bg)+grid(NOFACE,X,Y,U)+face+crown;
const L=[
["1 · Neutral","Los ojos de siempre, a distinta altura. Tranquilo, seguro.",base(px([[3,6],[3,7],[9,6]],K))],
["2 · Feliz (ojos ^ ^)","Ojos cerrados en arco: la cara de \"lo logré\" más clara de todas.",base(px([[2,7],[3,6],[4,7],[8,7],[9,6],[10,7]],K))],
["3 · Ojos grandes con brillo","Ojos de 2×2 con un pixel blanco: más tierno, se lee bien chico.",base(px([[3,6],[4,6],[3,7],[4,7],[8,6],[9,6],[8,7],[9,7]],K)+px([[3,6],[8,6]],W))],
["4 · Guiño","Un ojo abierto y el otro en línea: pícaro.",base(px([[3,6],[3,7],[8,7],[9,7],[10,7]],K))],
["5 · Sonrisa","Ojos normales y una boca pixel sonriendo.",base(px([[3,6],[3,7],[9,6],[5,9],[6,10],[7,10],[8,9]],K))],
["6 · Cachetes rosados","Ojos ^ ^ más mejillas rosadas: orgullo con vergüenza.",base(px([[2,7],[3,6],[4,7],[8,7],[9,6],[10,7]],K)+px([[2,8],[3,8],[9,8],[10,8]],P))],
["7 · Orgulloso","Párpados a media asta y sonrisa de lado: rey satisfecho.",base(px([[2,7],[3,7],[4,7],[8,7],[9,7],[10,7],[3,8],[9,8],[6,10],[7,10],[8,9]],K))],
["8 · Sorprendido","Ojos grandes y boca en \"o\": \"¿me coronaron a mí?\"",base(px([[3,6],[4,6],[3,7],[4,7],[8,6],[9,6],[8,7],[9,7],[6,10],[6,11]],K)+px([[3,6],[8,6]],W))],
["9 · Decidido","Cejas inclinadas hacia el centro: modo pelea, va por la racha.",base(px([[2,5],[3,5],[4,6],[10,5],[9,5],[8,6],[3,7],[9,7]],K))],
["10 · Ojos de estrella","Ojos en forma de estrella dorada: ganó el día.",base(px([[3,6],[2,7],[3,7],[4,7],[3,8],[9,6],[8,7],[9,7],[10,7],[9,8]],Yl)+px([[3,7],[9,7]],'#ff9f1c'))],
["11 · Corona + check verde","El neutral con el check en verde: combina con el \"hecho\" de la app y no compite con el dorado.",base(px([[3,6],[3,7],[9,6]],K))+chk(X,Y,U,'#3ee07a')],
["12 · Corona + check blanco","Check blanco: el más limpio, deja que la corona sea lo único con color.",base(px([[3,6],[3,7],[9,6]],K))+chk(X,Y,U,'#ffffff')]
];
const g=document.getElementById('g');
L.forEach(([t,d,s])=>{const v=SVG(s);g.insertAdjacentHTML('beforeend',`<div class="c">${v.replace('<svg','<svg class="big"')}<div class="row">${v}${v.replace('<svg','<svg class="sm"')}</div><h3>${t}</h3><p>${d}</p></div>`)});
</script></body></html>
