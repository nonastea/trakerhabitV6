<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logos V8</title>
<style>
body{margin:0;background:#0b0f14;color:#e8eef3;font-family:-apple-system,Segoe UI,sans-serif;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}p.s{opacity:.6;margin:0 0 24px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.c{background:#131a22;border-radius:18px;padding:16px}
.c svg.big{width:100%;height:auto;border-radius:22%;display:block}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.row svg{width:60px;height:60px;border-radius:22%}.row svg.sm{width:30px;height:30px}
h3{margin:12px 0 4px;font-size:15px}.c p{margin:0;font-size:13px;opacity:.75;line-height:1.4}
</style></head><body>
<h1>10 logos para la V8</h1><p class="s">Grande · tamaño real en el iPhone (60 px) · tamaño notificación (30 px)</p>
<div class="g" id="g"></div>
<script>
const P=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const L=[
["1 · Milo pixel con check","El Milo 16‑bit de siempre sobre el azul noche de la app, con un check en el pecho: el mandadero cumplió el encargo.",
`<rect width="512" height="512" fill="#001828"/>
<g shape-rendering="crispEdges">${P(176,112,160,32,'#c8721e')}${P(144,144,224,224,'#e08a2a')}${P(176,368,160,32,'#c8721e')}${P(112,192,32,128,'#8a4a14')}${P(368,192,32,128,'#8a4a14')}${P(248,72,16,40,'#3a2410')}
${P(200,200,24,32,'#1b1b1b')}${P(296,208,24,24,'#1b1b1b')}
${P(184,400,48,24,'#3a2410')}${P(280,400,48,24,'#3a2410')}
${P(208,296,24,24,'#00d4ff')}${P(232,320,24,24,'#00d4ff')}${P(256,296,24,24,'#00d4ff')}${P(280,272,24,24,'#00d4ff')}${P(304,248,24,24,'#00d4ff')}</g>`],
["2 · Milo dentro del anillo","El anillo de hábitos de HOY cerrado al 80 % (tu \"día perfecto\") y la cara de Milo asomándose en el centro.",
`<rect width="512" height="512" fill="#000305"/>
<circle cx="256" cy="256" r="170" fill="none" stroke="#0a2a3c" stroke-width="40"/>
<circle cx="256" cy="256" r="170" fill="none" stroke="#00d4ff" stroke-width="40" stroke-linecap="round" stroke-dasharray="854 1068" transform="rotate(-90 256 256)"/>
<circle cx="256" cy="270" r="112" fill="#e08a2a"/><circle cx="222" cy="252" r="12" fill="#1b1b1b"/><circle cx="292" cy="258" r="9" fill="#1b1b1b"/>
<path d="M256 158q-6-30 14-44" stroke="#3a2410" stroke-width="10" fill="none" stroke-linecap="round"/>`],
["3 · Milo noqueo años 30","Estilo del modo pelea: tinta gruesa, papel crema, ojos \"pac‑man\" y un guante blanco levantado. Grita \"juego\" desde el inicio.",
`<rect width="512" height="512" fill="#f3e6c4"/>
<g stroke="#111" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
<path d="M150 410q-30-170 70-230q90-40 150 40q50 80 10 190z" fill="#e8892c"/>
<ellipse cx="225" cy="270" rx="22" ry="34" fill="#fff"/><ellipse cx="292" cy="270" rx="22" ry="34" fill="#fff"/>
<path d="M378 300q40-30 40-90" fill="none"/><circle cx="420" cy="180" r="44" fill="#fff"/>
<path d="M250 185q-10-45 20-60" fill="none"/></g>
<path d="M225 255 l14 14 -14 14 z" fill="#111"/><path d="M292 255 l14 14 -14 14z" fill="#111"/>
<circle cx="225" cy="272" r="11" fill="#111"/><circle cx="292" cy="272" r="11" fill="#111"/>`],
["4 · La mochila","Solo la mochila de Milo con un check como hebilla. Es el objeto que carga todo: hábitos, piel, gym, plata.",
`<rect width="512" height="512" fill="#00111e"/>
<rect x="146" y="150" width="220" height="250" rx="60" fill="#c8721e"/>
<path d="M200 150q0-60 56-60t56 60" fill="none" stroke="#8a4a14" stroke-width="22"/>
<path d="M146 230h220v-20q0-60-60-60h-100q-60 0-60 60z" fill="#e08a2a"/>
<rect x="200" y="290" width="112" height="80" rx="18" fill="#8a4a14"/>
<circle cx="256" cy="232" r="38" fill="#00d4ff"/><path d="M238 232l12 12 22-24" stroke="#001828" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`],
["5 · Anillo de 5 áreas","Un anillo partido en las 5 pestañas (Hoy, Hábitos, Cuerpo, Plata, Datos), cada una con su color. Dice \"todo en una sola app\" sin Milo.",
`<rect width="512" height="512" fill="#000305"/>`+
['#00d4ff','#7cf2a0','#ff8a7a','#ffd166','#b18cff'].map((c,i)=>`<circle cx="256" cy="256" r="150" fill="none" stroke="${c}" stroke-width="56" stroke-dasharray="160 782" transform="rotate(${-90+i*72+6} 256 256)"/>`).join('')+
`<path d="M216 258l28 28 56-60" stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`],
["6 · La racha de sellos","Una semana de 7 cuadros: 6 marcados y el de hoy brillando. Es la crónica de días y lo que hace que no quieras romper la cadena.",
`<rect width="512" height="512" fill="#001828"/>`+
[0,1,2,3,4,5,6].map(i=>{const x=60+(i%4)*104,y=i<4?150:262,xx=i<4?x:x+52;const h=i==6;return `<rect x="${xx}" y="${y}" width="84" height="84" rx="20" fill="${h?'#00d4ff':'#0a3a52'}"/>`+(h?`<path d="${`M${xx+22} ${y+44}l14 14 28-30`}" stroke="#001828" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:`<circle cx="${xx+42}" cy="${y+42}" r="12" fill="#00d4ff" opacity=".7"/>`)}).join('')],
["7 · Papel y tinta","Para el tema crema: un check a mano alzada con tinta y una manchita naranja de Milo. Es el más sobrio y el que mejor envejece.",
`<rect width="512" height="512" fill="#f5efe0"/><circle cx="330" cy="190" r="46" fill="#e08a2a"/>
<path d="M130 270q40 20 90 90q60-150 190-230" stroke="#1b1b1b" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`],
["8 · Corazón de vida","El corazón pixel del juego con un check adentro: la vida de Milo sube cuando cumples. Une hábitos y modo juego.",
`<rect width="512" height="512" fill="#000305"/><g shape-rendering="crispEdges">`+
["..XX...XX..",".XXXX.XXXX.","XXXXXXXXXXX","XXXXXXXXXXX","XXXXXXXXXXX",".XXXXXXXXX.","..XXXXXXX..","...XXXXX...","....XXX....",".....X....."].map((r,j)=>[...r].map((ch,i)=>ch=='X'?P(80+i*32,112+j*32,32,32,(i+j)%5==0?'#ff6b6b':'#ff3b5c'):'').join('')).join('')+
P(176,240,32,32,'#fff')+P(208,272,32,32,'#fff')+P(240,240,32,32,'#fff')+P(272,208,32,32,'#fff')+P(304,176,32,32,'#fff')+`</g>`],
["9 · La moneda baro","Una moneda dorada acuñada con el check. Habla de la tienda de permisos y de PLATA: tus hábitos valen plata real.",
`<rect width="512" height="512" fill="#00111e"/><circle cx="256" cy="256" r="170" fill="#c9971f"/><circle cx="256" cy="246" r="170" fill="#ffd166"/>
<circle cx="256" cy="246" r="132" fill="none" stroke="#c9971f" stroke-width="12" stroke-dasharray="14 14"/>
<path d="M196 248l40 40 80-86" stroke="#8a5a00" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`],
["10 · Solo la cara de Milo","Fondo naranja entero, dos puntos asimétricos y el mechón. Nada más. Es la marca más reconocible en la pantalla de inicio.",
`<rect width="512" height="512" fill="#e08a2a"/><circle cx="196" cy="262" r="30" fill="#1b1b1b"/><circle cx="326" cy="276" r="22" fill="#1b1b1b"/>
<path d="M256 150q-14-50 24-80" stroke="#3a2410" stroke-width="18" fill="none" stroke-linecap="round"/>`]
];
const g=document.getElementById('g');
L.forEach(([t,d,s])=>{const v=`<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
g.insertAdjacentHTML('beforeend',`<div class="c">${v.replace('<svg','<svg class="big"')}<div class="row">${v}${v.replace('<svg','<svg class="sm"')}</div><h3>${t}</h3><p>${d}</p></div>`)});
</script></body></html>
