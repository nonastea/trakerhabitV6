<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variaciones Milo</title>
<style>
body{margin:0;background:#0b0f14;color:#e8eef3;font-family:-apple-system,Segoe UI,sans-serif;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}p.s{opacity:.6;margin:0 0 24px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.c{background:#131a22;border-radius:18px;padding:16px}
.c svg.big{width:100%;height:auto;border-radius:22%;display:block}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.row svg{width:60px;height:60px;border-radius:22%}.row svg.sm{width:30px;height:30px}
h3{margin:12px 0 4px;font-size:15px}.c p{margin:0;font-size:13px;opacity:.75;line-height:1.4}
</style></head><body>
<h1>10 variaciones del Milo pixel</h1><p class="s">Grande · iPhone (60 px) · notificación (30 px)</p>
<div class="g" id="g"></div>
<script>
const R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const COL={h:'#3a2410',o:'#c8721e',O:'#e08a2a',L:'#f2a54a',b:'#8a4a14',e:'#1b1b1b',f:'#3a2410',c:'#00d4ff',w:'#ffffff',y:'#ffd166',r:'#ff3b5c',p:'#ff8fb1'};
function grid(map,x,y,u,over={}){let s='';map.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='.')return;s+=R(x+i*u,y+j*u,u,u,over[ch]||COL[ch])}));return s}
// Milo base 14x16
const M=[
"......h.......",
"......h.......",
"....oooooo....",
"...oLLOOOOo...",
"..oLOOOOOOOo..",
"..oOOOOOOOOo..",
".oOeOOOOOeOOo.",
".oOeOOOOOOOOo.",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
"boOOOOOOOOOOob",
".oOOOOOOOOOOo.",
"..oOOOOOOOOo..",
"...oooooooo...",
"...ff....ff...",
"...ff....ff..."];
const CHK=[[4,11],[5,12],[6,11],[7,10],[8,9]];
const chk=(x,y,u,c='#00d4ff')=>CHK.map(([i,j])=>R(x+i*u,y+j*u,u,u,c)).join('');
const milo=(x,y,u,opt={})=>{let m=opt.map||M;let s=grid(m,x,y,u);if(opt.check!==false)s+=chk(x,y,u,opt.cc);return s};
const JUMP=M.slice(0,16).concat(["..ff......ff..",".ff........ff."]);
const bubbleChk=(x,y,u,c)=>[[0,2],[1,3],[2,2],[3,1],[4,0]].map(([i,j])=>R(x+i*u,y+j*u,u,u,c)).join('');
const SVG=s=>`<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${s}</svg>`;
const stars=(c,pts)=>pts.map(([x,y,u])=>R(x,y,u,u,c)).join('');
const L=[
["1 · El original pulido","El mismo de antes con borde de luz en la cabeza y ojos a distinta altura (más Milo). La base de todas.",
R(0,0,512,512,'#001828')+milo(88,40,24)],
["2 · Milo con tu tema minimalista","Fondo negro puro del tema minimalista: el naranja salta más y en la pantalla de inicio se ve como un sticker.",
R(0,0,512,512,'#000')+milo(88,40,24)],
["3 · Milo en el anillo pixel","Un anillo pixelado al 80 % alrededor: mezcla el anillo de HOY con el juego.",
R(0,0,512,512,'#000305')+(()=>{let s='';for(let a=0;a<360;a+=6){const r=a/360<.8;const x=256+200*Math.sin(a*Math.PI/180),y=256-200*Math.cos(a*Math.PI/180);s+=R(Math.round(x/16)*16-8,Math.round(y/16)*16-8,16,16,r?'#00d4ff':'#0a2a3c')}return s})()+milo(144,112,16)],
["4 · Milo saltando de alegría","En el aire con las piernas abiertas y chispas: el momento en que marcas el hábito.",
R(0,0,512,512,'#00111e')+milo(88,8,24,{map:JUMP})+R(152,470,208,12,'#0a2a3c')+stars('#ffd166',[[48,96,24],[440,120,24],[64,320,16],[440,360,16]])],
["5 · Milo con globo de check","Milo sin check en el pecho y un globo de diálogo pixel con el check: \"¡listo, encargo cumplido!\"",
R(0,0,512,512,'#001828')+milo(40,96,22,{check:false})+R(300,40,180,130,'#fff')+R(290,50,200,110,'#fff')+R(300,170,24,24,'#fff')+bubbleChk(330,60,24,'#00a8cc')],
["6 · Primer plano","Milo gigante llenando todo el ícono, cortado abajo: en 30 px se sigue leyendo perfecto. El más legible.",
R(0,0,512,512,'#001828')+milo(4,-60,36)],
["7 · Milo guiñando","Un ojo cerrado (línea) y check dorado: más pícaro, más personaje.",
R(0,0,512,512,'#001828')+milo(88,40,24,{cc:'#ffd166',map:M.map((r,j)=>j==6?r.replace(/e(OOo\.)$/,'O$1'):r)})+R(88+8*24,40+6*24,72,24,'#1b1b1b')],
["8 · Milo en papel crema","Fondo crema del tema papel con sombra pixel dura: más cálido, menos \"app de tecnología\".",
R(0,0,512,512,'#f5efe0')+grid(M,104,56,24,{h:'#d8cbb0',o:'#d8cbb0',O:'#d8cbb0',L:'#d8cbb0',b:'#d8cbb0',e:'#d8cbb0',f:'#d8cbb0'})+milo(88,40,24,{cc:'#1b1b1b'})],
["9 · Milo con HUD de juego","Corazones y una moneda arriba como barra de vida: grita \"videojuego\" sin perder el check.",
R(0,0,512,512,'#000305')+milo(102,100,22)+[0,1,2].map(i=>grid(["rr.rr","rrrrr",".rrr.","..r.."],40+i*84,30,13)).join('')+grid([".yyy.","yyyyy","yyyyy",".yyy."],416,30,14)],
["10 · Milo coronado","Corona dorada pixel: el día perfecto (80 %+). Puede ser el ícono normal o el que se gana en rachas.",
R(0,0,512,512,'#001828')+grid(["y..y..y","yyyyyyy","yyyyyyy"],172,24,24)+milo(88,40,24).replace(/fill="#3a2410"/,'fill="#3a2410"')]
];
const g=document.getElementById('g');
L.forEach(([t,d,s])=>{const v=SVG(s);g.insertAdjacentHTML('beforeend',`<div class="c">${v.replace('<svg','<svg class="big"')}<div class="row">${v}${v.replace('<svg','<svg class="sm"')}</div><h3>${t}</h3><p>${d}</p></div>`)});
</script></body></html>
